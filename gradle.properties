org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Building on-device in Termux (ARM64 Pixel)? Google's aapt2 is x86_64-only
# and won't run there. Uncomment and point this at an ARM64 aapt2 binary
# (see the "Building On-Device in Termux" section in README.md), then run
# `./gradlew --stop` once after changing it.
#android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
